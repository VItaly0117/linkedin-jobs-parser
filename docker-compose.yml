services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: linkedin
      POSTGRES_USER: linkedin
      POSTGRES_PASSWORD: linkedin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkedin"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: .
    env_file: .env
    command: >
      sh -c "python manage.py migrate &&
             (python manage.py createsuperuser --noinput || true) &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Часть 1: docker compose run --rm search
  search:
    build: .
    env_file: .env
    command: python manage.py run_search
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    profiles: ["parsers"]

  # Часть 2: docker compose run --rm details
  details:
    build: .
    env_file: .env
    command: python manage.py run_details
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    profiles: ["parsers"]

volumes:
  pgdata:
